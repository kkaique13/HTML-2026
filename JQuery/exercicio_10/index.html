<html>
    <head>
        <link rel="stylesheet" href="style.css">
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js"></script>
        <script type="text/javascript" src="script.js"></script>
    </head>
    <body>
        <div class="calculadora">
            <h1>Calculadora</h1>
            <div class="dados">
                <input type="number" id="num1" placeholder="Primeiro número">
                <input type="number" id="num2" placeholder="Segundo número">
                <div class="butoes">
                    <button onclick="somar()">Somar</button>
                    <button id="subtrair" onclick="subtrair()">Subtrair</button>
                    <button id="multiplicar" onclick="multiplicar()">Multiplicar</button>
                    <button id="dividir" onclick="dividir()">Dividir</button>
                </div>
            </div>
        </div>

        <div class="resultado">
            <h1>Resultado</h1>
            <p id="conta"></p>
        </div>
    </body>
</html>
